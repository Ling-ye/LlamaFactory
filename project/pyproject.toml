[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "factory-project-tools"
version = "0.2.0"
description = "Dataset auditing and evaluation helpers for native LLaMA-Factory workflows"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6,<7", "typer>=0.15,<1", "huggingface-hub>=0.30,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.11,<1"]
tracking = ["mlflow-skinny>=3,<4", "sqlalchemy>=2,<3", "alembic>=1.14,<2"]

[project.scripts]
lf-tools = "lf_tools.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
